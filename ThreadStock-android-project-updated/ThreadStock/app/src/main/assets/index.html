<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}
.uiopt .uiact { display: flex; gap: 6px; margin-top: 2px; } .uiopt .uiact .btn { flex: 1; min-width: 0; padding-inline: 8px; }
#uibar { position: fixed; z-index: 95; top: calc(8px + env(safe-area-inset-top, 0px)); left: 12px; right: 12px; max-width: 460px; margin: 0 auto; display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 14px; border-radius: 16px; background: var(--ink); color: var(--bg); box-shadow: 0 12px 34px rgba(0,0,0,.35); }
#uibar .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.2; } #uibar small { font-size: 11.5px; opacity: .75; } #uibar b { font-size: 15px; }
#uibar button { border: 1.5px solid currentColor; background: transparent; color: inherit; border-radius: 11px; min-height: 42px; padding: 0 14px; font-weight: 700; font-size: 14px; } #uibar button.ap { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.gb{position:relative;display:flex;gap:12px;align-items:center;border-radius:20px;padding:13px 14px 16px;overflow:hidden;background:var(--surface);color:var(--ink);box-shadow:0 14px 40px rgba(0,0,0,.28);--dur:2.5s;--it:1;min-width:0}
#welcome{position:fixed;z-index:80;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;margin:0 auto;max-width:440px;animation:wcio 2.5s cubic-bezier(.2,.8,.2,1) both;cursor:pointer;border-radius:20px}
.gb.pv{--dur:3.6s;--it:infinite;box-shadow:0 6px 18px rgba(0,0,0,.16);width:100%;animation:wcio 3.6s cubic-bezier(.2,.8,.2,1) infinite}
.gb img{width:44px;height:44px;border-radius:12px;flex:none}.gb .wt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.gb small{font-size:12.5px;color:inherit;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gb:not(.gb-sunrise):not(.gb-neon):not(.gb-bounce):not(.gb-ribbon) small{color:var(--ink2);opacity:1}
.gb b{font-family:var(--f-display);font-size:18px;font-weight:800;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gb .a{animation-duration:var(--dur);animation-iteration-count:var(--it);animation-fill-mode:both}
@keyframes wcio{0%{transform:translateY(-150%)}14%,84%{transform:none}100%{transform:translateY(-150%)}}
@keyframes gt{to{transform:scaleX(0)}}@keyframes gg{0%{opacity:0;letter-spacing:.3em}16%,100%{opacity:1;letter-spacing:0}}
@keyframes gw{0%,12%{transform:rotate(0)}20%{transform:rotate(16deg)}28%{transform:rotate(-8deg)}36%{transform:rotate(14deg)}44%{transform:rotate(-4deg)}52%{transform:rotate(10deg)}60%,100%{transform:rotate(0)}}
@keyframes gs{0%,14%{opacity:0;transform:translate(0,0)}16%{opacity:1}42%,100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
.gb-wave .wv{width:28px;height:28px;flex:none;color:var(--wc);transform-origin:70% 70%}
.gb-wave .sp i{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--wc);opacity:0;top:50%;right:26px}
.gb-wave .sp i:nth-child(1){--dx:-18px;--dy:-24px}.gb-wave .sp i:nth-child(2){--dx:12px;--dy:-28px}.gb-wave .sp i:nth-child(3){--dx:22px;--dy:-10px}
.gb-wave .tm{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--wc);opacity:.6;transform-origin:left}
/* sunrise */
@keyframes gsun{0%{transform:translateY(46px) scale(.55);opacity:0}24%,100%{transform:none;opacity:1}}@keyframes gpl{0%,20%{box-shadow:0 0 0 0 rgba(255,255,255,.55)}70%,100%{box-shadow:0 0 0 16px rgba(255,255,255,0)}}
@keyframes gsl{0%,8%{opacity:0;transform:translateX(-16px)}26%,100%{opacity:1;transform:none}}
.gb-sunrise{color:#fff}.gb-sunrise.k0{background:linear-gradient(120deg,#F59E0B,#EF4F7E)}.gb-sunrise.k1{background:linear-gradient(120deg,#0EA5E9,#14B8A6)}.gb-sunrise.k2{background:linear-gradient(120deg,#4F46E5,#9333EA)}
.gb-sunrise .sun{width:46px;height:46px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 35%,#FFF7C2,#FFD34D 60%,#FFB020)}.gb-sunrise.k2 .sun{background:radial-gradient(circle at 35% 35%,#fff,#DDE3FF 60%,#B9C2FF)}
.gb-sunrise .wt{}
/* confetti */
@keyframes gcf{0%,6%{opacity:0;transform:translate(0,0) rotate(0) scale(.4)}10%{opacity:1}44%{opacity:1;transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1)}72%,100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) + 44px)) rotate(calc(var(--r) * 2)) scale(1)}}
@keyframes gpop{0%,6%{transform:scale(.6);opacity:0}20%{transform:scale(1.07);opacity:1}30%,100%{transform:scale(1);opacity:1}}
.gb-confetti .cf{position:absolute;left:36px;top:50%;width:0;height:0}.gb-confetti .cf i{position:absolute;width:7px;height:10px;border-radius:2px;opacity:0}
.gb-confetti{background:linear-gradient(120deg,var(--surface),var(--accent-soft))}
/* neon */
@keyframes gty{0%,8%{clip-path:inset(0 100% 0 0)}46%,100%{clip-path:inset(0 0 0 0)}}@keyframes gbk{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes ggl{0%,100%{box-shadow:0 0 12px rgba(34,211,238,.45),inset 0 0 10px rgba(34,211,238,.2)}50%{box-shadow:0 0 26px rgba(34,211,238,.9),inset 0 0 16px rgba(34,211,238,.35)}}
.gb-neon{background:#0A0F1E;color:#E8FBFF;border:1px solid #22D3EE;animation-name:ggl}
#welcome.gb-neon{animation:wcio 2.5s cubic-bezier(.2,.8,.2,1) both,ggl 1.2s ease-in-out infinite}.gb-neon.pv{animation:wcio 3.6s cubic-bezier(.2,.8,.2,1) infinite,ggl 1.2s ease-in-out infinite}
.gb-neon b{text-shadow:0 0 8px #22D3EE,0 0 18px rgba(34,211,238,.7);color:#B6F7FF;overflow:visible;position:relative;display:inline-block;width:fit-content;max-width:100%}.gb-neon b span.ty{display:inline-block}
.gb-neon .cu{display:inline-block;width:2px;height:1em;background:#22D3EE;margin-inline-start:3px;vertical-align:-2px;box-shadow:0 0 6px #22D3EE}
/* bounce */
@keyframes gbn{0%,8%{transform:translateY(0)}16%{transform:translateY(-9px)}24%,100%{transform:translateY(0)}}@keyframes gdr{0%,6%{opacity:0;transform:translateY(-14px)}22%,100%{opacity:1;transform:none}}@keyframes grot{0%{transform:rotate(-200deg) scale(.3);opacity:0}24%,100%{transform:none;opacity:1}}
.gb-bounce{background:var(--accent);color:var(--accent-ink)}.gb-bounce .g{display:flex;font-size:13.5px;font-weight:700;opacity:1}.gb-bounce .g span{display:inline-block;white-space:pre}
/* ribbon */
@keyframes gsh{0%,10%{transform:translateX(-130%) skewX(-20deg)}55%,100%{transform:translateX(260%) skewX(-20deg)}}@keyframes gwp{0%,8%{clip-path:inset(0 100% 0 0)}36%,100%{clip-path:inset(0 0 0 0)}}@keyframes gsp{0%{transform:rotate(-120deg) scale(0)}26%{transform:rotate(0) scale(1.15)}34%,100%{transform:rotate(0) scale(1)}}
.gb-ribbon{background:linear-gradient(100deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#000));color:var(--accent-ink)}.gb-ribbon .shine{position:absolute;top:0;bottom:0;width:38%;left:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent)}
.gb-ribbon .st{width:30px;height:30px;flex:none}
.gpv{height:94px;border-radius:14px;background:var(--bg);border:1px solid var(--line2);overflow:hidden;display:flex;align-items:center;padding:0 10px}
.gcard{display:flex;flex-direction:column;gap:8px}.gcard .grow{display:flex;align-items:center;gap:10px}.gcard .grow b{flex:1;font-size:14px}
@media(prefers-reduced-motion:reduce){.gb,.gb *{animation-duration:.01s!important}}

#nbar{position:fixed;z-index:85;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;margin:0 auto;max-width:440px;display:flex;gap:12px;align-items:center;padding:12px 14px 15px;border-radius:18px;background:var(--surface);color:var(--ink);box-shadow:0 14px 40px rgba(0,0,0,.3);overflow:hidden;transform:translateY(-150%);animation:nbio 1.5s cubic-bezier(.2,.8,.2,1) both;border-inline-start:5px solid var(--accent)}
#nbar>svg{width:26px;height:26px;flex:none;color:var(--accent)}#nbar .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}#nbar b{font-size:14.5px}#nbar .tx span{font-size:13px;color:var(--ink2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#nbar .tm{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--accent);opacity:.6;transform-origin:left;animation:gt 1.5s linear both}
@keyframes nbio{0%{transform:translateY(-150%)}16%,86%{transform:none}100%{transform:translateY(-150%)}}

.check > input[type=checkbox] { flex: none; width: 22px; height: 22px; }

<style>
/* Layout concept: one phone-width column. Top bar, scrolling body, bottom tab bar.
   Sheets slide up for forms. Teal accent on cool neutrals so thread colours stand out. */
:root {
  --bg:#F2F6F6; --surface:#FFFFFF; --surface2:#E8EFEF; --ink:#12242A; --ink2:#52676D; --line:#D8E2E3; --line2:#BFCFD1;
  --accent:#0A7580; --accent-ink:#FFFFFF; --accent-soft:#D6EFF0;
  --cash:#1A8449; --cash-soft:#DAF2E4; --credit:#B25C08; --credit-soft:#FAE8CF; --online:#5646C6; --online-soft:#E8E5FB; --ylw:#E0A800; --ylw-soft:#FBF0C8; --exch:#0E86A8; --exch-soft:#D5EEF5; --bad:#BE352C; --bad-soft:#F9DDDA;
  --shadow:0 1px 2px rgba(18,36,42,.06), 0 8px 22px rgba(18,36,42,.07);
  --scrim:rgba(10,24,28,.48);
  --f-display:'Plus Jakarta Sans','Noto Naskh Arabic',system-ui,sans-serif;
  --f-body:'Figtree','Noto Naskh Arabic',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0D1A1D; --surface:#14262A; --surface2:#1B3135; --ink:#E5F0F1; --ink2:#92A9AE; --line:#244047; --line2:#32555D;
    --accent:#3DC0CA; --accent-ink:#04252A; --accent-soft:#123D42;
    --cash:#55CB8C; --cash-soft:#12392B; --credit:#F2A24C; --credit-soft:#3F2B12; --online:#A99BFF; --online-soft:#2A2550; --ylw:#F5C542; --ylw-soft:#3B3112; --exch:#5CC8E6; --exch-soft:#123540; --bad:#FF7B72; --bad-soft:#431C1A;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 22px rgba(0,0,0,.3); --scrim:rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:#0D1A1D; --surface:#14262A; --surface2:#1B3135; --ink:#E5F0F1; --ink2:#92A9AE; --line:#244047; --line2:#32555D;
  --accent:#3DC0CA; --accent-ink:#04252A; --accent-soft:#123D42;
  --cash:#55CB8C; --cash-soft:#12392B; --credit:#F2A24C; --credit-soft:#3F2B12; --online:#A99BFF; --online-soft:#2A2550; --ylw:#F5C542; --ylw-soft:#3B3112; --exch:#5CC8E6; --exch-soft:#123540; --bad:#FF7B72; --bad-soft:#431C1A;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 22px rgba(0,0,0,.3); --scrim:rgba(0,0,0,.6);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.4; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }
bdi.m, .num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { height: 100%; }
.shell { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; background: var(--bg); position: relative; }
@media (min-width: 600px) { .shell { border-inline: 1px solid var(--line); } }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.bar { flex: none; background: var(--bg); }
.barin { display: flex; align-items: center; gap: 10px; min-height: 60px; padding-block: 8px; }
.barin h1 { font-family: var(--f-display); font-weight: 800; font-size: 21px; letter-spacing: -.01em; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.eyebrow { font-size: 12px; color: var(--ink2); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.hello { flex: 1; min-width: 0; }
.brandrow { display: flex; align-items: center; gap: 10px; }
.brandrow .mark { width: 40px; height: 40px; flex: none; border-radius: 10px; }
.brandrow .tx { min-width: 0; }
.lock .mark { width: 96px; height: 96px; border-radius: 22px; filter: drop-shadow(0 6px 14px rgba(0,40,120,.25)); }
.lock .bio { margin-top: 2px; }
.appcredit { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 22px 0 6px; text-align: center; color: var(--ink2); font-size: 13px; }
.appcredit img { width: 56px; height: 56px; border-radius: 14px; }
.appcredit b { font-family: var(--f-display); font-size: 16px; color: var(--ink); }
.appcredit .by { font-weight: 600; color: var(--ink); }
.hello h1 { font-size: 22px; }
.iconbtn { width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }
.iconbtn svg { width: 22px; height: 22px; }
.iconbtn.plain { border-color: transparent; background: transparent; }
.userchip { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px 4px 4px; max-width: 160px; }
.userchip span.n { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
[dir=rtl] .flip { transform: scaleX(-1); }

/* scroll area */
.mainwrap { flex: 1; min-height: 0; position: relative; }
.scroll { height: 100%; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; }
.body { padding-block: 4px 96px; display: flex; flex-direction: column; gap: 16px; }
.body.nofab { padding-bottom: 28px; }
.fab { position: absolute; inset-inline-end: max(16px, env(safe-area-inset-right, 0px)); bottom: 16px; height: 54px; padding: 0 20px; border-radius: 18px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow); }
.fab svg { width: 22px; height: 22px; }

/* tab bar */
.tabs { flex: none; background: var(--surface); border-top: 1px solid var(--line); }
.tabsin { display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { border: 0; background: none; padding: 9px 2px 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--ink2); font-size: 11.5px; font-weight: 600; min-height: 58px; position: relative; }
.tab svg { width: 24px; height: 24px; }
.tab.on { color: var(--accent); }
.tab .dot { position: absolute; top: 6px; inset-inline-start: calc(50% + 8px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 99px; background: var(--bad); color: #fff; font-size: 10px; line-height: 16px; text-align: center; font-weight: 700; }

/* cards & rows */
.card { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 16px; }
.card.flat { box-shadow: none; border: 1px solid var(--line); }
.sec { display: flex; flex-direction: column; gap: 8px; }
.sechead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sechead h2 { font-family: var(--f-display); font-size: 16px; font-weight: 700; }
.link { border: 0; background: none; color: var(--accent); font-weight: 700; font-size: 13px; padding: 4px 0; }
.cmp { display: grid; grid-template-columns: 1.1fr 1fr 1fr .8fr; gap: 6px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; font-variant-numeric: tabular-nums; } .cmp:last-child { border-bottom: 0; } .cmp.h { font-size: 11.5px; color: var(--ink2); font-weight: 700; padding-top: 0; } .cmp .k { color: var(--ink2); } .cmp .pv { color: var(--ink2); } .cmp > :last-child { text-align: end; font-weight: 700; font-size: 13px; }
.palgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.pal { position: relative; display: flex; flex-direction: column; gap: 8px; align-items: stretch; text-align: start; padding: 8px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface); min-width: 0; }
.pal.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.pal .pn { font-weight: 700; font-size: 13.5px; padding-inline: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pal-sw { display: flex; gap: 6px; align-items: flex-end; height: 54px; padding: 8px; border-radius: 11px; border: 1px solid rgba(128,128,128,.25); } .pal-sw i { flex: 1; border-radius: 7px; height: 60%; } .pal-sw i:nth-child(2) { height: 100%; } .pal-sw i:nth-child(3) { height: 40%; }
.pal .pt { position: absolute; top: 14px; inset-inline-end: 14px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; } .pal .pt svg { width: 14px; height: 14px; }
:root[data-pal] .hero { background: linear-gradient(155deg, var(--accent-soft), var(--surface) 68%); }
:root[data-pal] .fab { box-shadow: 0 10px 26px color-mix(in srgb, var(--accent) 40%, transparent); }
:root[data-pal] .item, :root[data-pal] .card { border-radius: 20px; }
.crow { display: flex; align-items: center; background: none; border-bottom: 1px solid var(--line); } .crow .item { border-bottom: 0; flex: 1; min-width: 0; width: auto; padding-inline-end: 8px; } .crow .item .main { min-width: 0; } .crow .item .s { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crow .cq { flex: none; width: 34px; height: 34px; margin-inline-end: 10px; border-radius: 12px; background: var(--surface2); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; text-decoration: none; } .crow .cq.wa { color: #1A8449; } .crow .cq svg { width: 18px; height: 18px; }
.list > .crow:last-child { border-bottom: 0; }
.cstrip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; } .cstrip .sc { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 10px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cstrip .k { font-size: 11.5px; color: var(--ink2); font-weight: 600; } .cstrip b { font-size: 15.5px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; } .cstrip .h { font-size: 11.5px; color: var(--ink2); }
.list { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; width: 100%; text-align: start; border: 0; background: none; border-bottom: 1px solid var(--line); min-height: 60px; }
.item:last-child { border-bottom: 0; }
button.item:active { background: var(--surface2); }
.item .main { flex: 1; min-width: 0; }
.item .main > .t { display: block; }
.item .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .main > .s { display: block; }
.item .s { font-size: 12.5px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .end { text-align: end; flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.item .end .v { font-weight: 700; }
.empty { padding: 28px 18px; text-align: center; color: var(--ink2); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty b { color: var(--ink); font-family: var(--f-display); font-size: 16px; }

/* hero */
.hero.tap { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.hero .hrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.hero .hcount { display: inline-flex; align-items: center; gap: 6px; color: var(--ink2); font-weight: 600; font-size: 14px; }
.hero .chv { display: inline-flex; transition: transform .2s; transform: rotate(90deg); }
.hero .chv.up { transform: rotate(-90deg); }
.hero .chv svg { width: 18px; height: 18px; }
.hero .mini { display: flex; flex-wrap: wrap; gap: 8px; }
.hero .mi { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: var(--surface2); font-size: 14px; }
.hero .mi b { font-variant-numeric: tabular-nums; }
.hero .hint { font-size: 13px; }
.bigsale { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 16px; border: 0; border-radius: 16px; background: var(--accent); color: var(--accent-ink); font-size: 17px; font-weight: 700; box-shadow: var(--shadow); }
.bigsale svg { width: 24px; height: 24px; }
.quick { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; }
.hero .retbox { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; padding: 8px 12px; border-radius: 12px; background: var(--surface2); text-align: end; }
.hero .retbox b { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
.hero .retbox.has { background: color-mix(in srgb, var(--bad) 12%, var(--surface)); }
.hero .retbox.has b { color: var(--bad); }
.hero .htap { display: flex; flex-direction: column; gap: 14px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.hero .hfoot { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--ink2); font-size: 13px; }
.hero .hmore { display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
.hero .hhead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.hero .hhead b { font-family: var(--f-display); font-size: 22px; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface2); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .k { font-size: 12px; color: var(--ink2); font-weight: 600; }
.stat b { font-size: 16px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.ins { font-size: 13.5px; color: var(--ink2); }
.ins b { color: var(--ink); }
.chart { width: 100%; height: auto; display: block; }
.chart .bar { fill: var(--accent); opacity: .42; }
.chart .bar.hi { opacity: 1; }
.chart .lb { font-size: 9.5px; fill: var(--ink2); font-family: inherit; }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart .gl.d { stroke-dasharray: 3 4; }
.donut { width: 128px; height: 128px; flex: none; }
.donut .dt { font-size: 11px; font-weight: 800; fill: var(--ink); font-family: inherit; }
.donut .ds { font-size: 8.5px; fill: var(--ink2); font-family: inherit; }
.payrow { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 8px 0; }
.plist { flex: 1; min-width: 160px; display: flex; flex-direction: column; gap: 8px; }
.prow { display: grid; grid-template-columns: 1fr auto 42px; gap: 8px; align-items: center; font-size: 14px; }
.prow .pc { color: var(--ink2); text-align: end; font-size: 12.5px; }
.sub2 { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink2); margin: 12px 0 4px; }
.rank { width: 22px; height: 22px; border-radius: 50%; background: var(--surface2); font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.xrow2 { margin: 4px 0 8px; }
.xwrap { border-bottom: 1px solid var(--line); }
.xwrap:last-child { border-bottom: 0; }
.xwrap > .item { border-bottom: 0; }
.xpanel { padding: 4px 14px 14px; display: flex; flex-direction: column; gap: 6px; background: var(--surface2); }
.xpanel .xh { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; margin-top: 8px; }
.xpanel .xh svg { width: 14px; height: 14px; }
.xpanel .xh.in { color: var(--bad); }
.xpanel .xh.out { color: var(--cash); }
.xpanel .xl { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.xpanel .xres { font-size: 13.5px; padding: 8px 0 2px; border-top: 1px dashed var(--line); margin-top: 4px; }

.acct { display: flex; flex-direction: column; gap: 10px; }

.split.hseg .s-sales { background: var(--cash); } .split.hseg .s-credit { background: var(--ylw); } .split.hseg .s-ret { background: var(--bad); } .split.hseg .s-exch { background: var(--exch); }
.legend.hseg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; margin-top: 10px; }

.legend.hseg button.on { background: var(--surface2); }
.hbarwrap { } .segpanel { margin: 0; display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 14px; background: var(--surface2); }
.segpanel .ph { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; }
.segpanel .rrow { display: flex; justify-content: space-between; gap: 10px; text-align: start; background: var(--surface); border: 0; border-radius: 12px; padding: 10px 12px; font: inherit; color: var(--ink); width: 100%; cursor: pointer; }
.segpanel .rrow .l { display: flex; flex-direction: column; gap: 2px; min-width: 0; } .segpanel .rrow > b { white-space: nowrap; } .segpanel .rrow small { color: var(--ink2); font-size: 12.5px; }
.split .c1 { background: var(--cash); } .split .c2 { background: var(--credit); } .split .c3 { background: var(--online); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--ink2); }
.legend b { color: var(--ink); font-weight: 700; }
.dotk { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-inline-end: 6px; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); text-align: start; border: 0; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile .k { font-size: 12.5px; color: var(--ink2); font-weight: 600; }
.tile .n { font-family: var(--f-display); font-weight: 800; font-size: 20px; letter-spacing: -.01em; }
.tile .h { font-size: 12px; color: var(--ink2); }

.quick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.qbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 12px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; min-width: 0; text-align: center; }

.banner { border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; background: var(--credit-soft); color: var(--ink); }
.banner.info { background: var(--accent-soft); }
.banner .tx { flex: 1; font-size: 13.5px; min-width: 0; }
.banner .tx b { display: block; font-size: 14px; }

/* buttons, fields */
.btn { border: 0; border-radius: 14px; min-height: 48px; padding: 0 18px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--surface2); color: var(--ink); }
.btn svg { width: 20px; height: 20px; }
.btn.pri { background: var(--accent); color: var(--accent-ink); }
.btn.bad { background: var(--bad); color: #fff; }

.btn.block { width: 100%; }

.btns { display: flex; gap: 8px; flex-wrap: wrap; }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .lbl { font-size: 12.5px; font-weight: 700; color: var(--ink2); letter-spacing: .02em; }
.inp { width: 100%; min-height: 48px; border: 1px solid var(--line2); background: var(--surface); border-radius: 12px; padding: 0 14px; color: var(--ink); }
textarea.inp { padding: 12px 14px; min-height: 76px; resize: vertical; }
.inp:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }

.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.search { position: relative; }

.search .inp { padding-inline-start: 44px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface2); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: none; border-radius: 11px; min-height: 42px; font-weight: 700; color: var(--ink2); display: flex; align-items: center; justify-content: center; gap: 6px; }
.seg button svg { width: 18px; height: 18px; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.seg button.on.cash { color: var(--cash); } .seg button.on.credit { color: var(--credit); } .seg button.on.online { color: var(--online); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line2); background: var(--surface); border-radius: 99px; padding: 0 14px; min-height: 36px; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 99px; padding: 2px 9px; font-size: 11.5px; font-weight: 700; white-space: nowrap; background: var(--surface2); color: var(--ink2); }
.pill.cash, .pill.ok { background: var(--cash-soft); color: var(--cash); }
.pill.credit, .pill.warn { background: var(--credit-soft); color: var(--credit); }
.pill.online { background: var(--online-soft); color: var(--online); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.acc { background: var(--accent-soft); color: var(--accent); }
.good { color: var(--cash); } .badc { color: var(--bad); } .warnc { color: var(--credit); } .mut { color: var(--ink2); }

.check { display: flex; align-items: center; gap: 10px; min-height: 44px; }

/* thread visuals */
.sw { display: inline-block; flex: none; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1.5px rgba(0,0,0,.18), inset 0 -5px 8px rgba(0,0,0,.14); }
.sw.none { background: repeating-linear-gradient(45deg, var(--surface2) 0 5px, var(--line) 5px 10px); }
.th { width: 48px; height: 48px; border-radius: 12px; object-fit: cover; background: var(--surface2); flex: none; display: grid; place-items: center; }
.th.lg { width: 64px; height: 64px; border-radius: 16px; }
.th svg { width: 70%; height: 70%; }
.fl { fill: var(--line2); }
.avatar svg { width: 20px; height: 20px; }
.datebar { display: flex; gap: 8px; align-items: center; }
.datelbl { flex: 1; position: relative; min-height: 44px; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; display: grid; place-items: center; font-weight: 700; padding: 0 8px; text-align: center; }
.datelbl input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.led .t { font-weight: 600; }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart .bc { fill: var(--cash); } .chart .bk { fill: var(--credit); } .chart .bo { fill: var(--online); }
.sheet .sb p { margin: 0; }
.mainwrap > .fab, .mainwrap > .cartbar { z-index: 5; }
.avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; background: var(--accent-soft); color: var(--accent); flex: none; }
.avatar.sm { width: 32px; height: 32px; font-size: 13px; }
.dots { display: flex; gap: 4px; margin-top: 4px; }
.dots .sw { width: 13px; height: 13px; }

/* product grid + colour tiles */
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.pcard { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); border: 0; padding: 10px; display: flex; flex-direction: column; gap: 8px; text-align: start; min-width: 0; position: relative; }
.pcard .ph { aspect-ratio: 4/3; border-radius: 12px; background: var(--surface2); display: grid; place-items: center; overflow: hidden; }
.pcard .ph img { width: 100%; height: 100%; object-fit: cover; }
.pcard .ph svg { width: 46%; height: 46%; }
.pcard .nm { font-weight: 700; font-size: 14px; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; min-height: 35px; }
.pcard .bd { position: absolute; top: 16px; inset-inline-start: 16px; }
.pcard .ct { position: absolute; top: 16px; inset-inline-end: 16px; background: var(--accent); color: var(--accent-ink); min-width: 24px; height: 24px; border-radius: 99px; display: grid; place-items: center; font-size: 12px; font-weight: 800; padding: 0 6px; }
.ctiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ctile { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-width: 0; position: relative; }
.ctile .sw { width: 38px; height: 38px; }
.ctile img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; }

.ctile .st .stl { font-size: 14px; }
.ctile .cn { font-weight: 600; font-size: 12.5px; line-height: 1.2; overflow-wrap: anywhere; }
.ctile .st { font-size: 11.5px; color: var(--ink2); }
.ctile.sel { border-color: var(--accent); background: var(--accent-soft); }
.ctile.out { opacity: .5; }
.ctile .ct { position: absolute; top: 6px; inset-inline-end: 6px; background: var(--accent); color: var(--accent-ink); min-width: 22px; height: 22px; border-radius: 99px; display: grid; place-items: center; font-size: 12px; font-weight: 800; padding: 0 5px; }
.palette { display: flex; flex-wrap: wrap; gap: 8px; }
.palette button { width: 34px; height: 34px; border-radius: 50%; border: 2px solid transparent; padding: 0; background: var(--c); box-shadow: inset 0 0 0 1.5px rgba(0,0,0,.2); }
.palette button.on { border-color: var(--ink); }
.photobox { width: 100%; aspect-ratio: 16/8; border: 2px dashed var(--line2); border-radius: 16px; background: var(--surface2); display: grid; place-items: center; overflow: hidden; color: var(--ink2); font-weight: 600; position: relative; }
.photobox img { width: 100%; height: 100%; object-fit: cover; }
.photobox .ph { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 13px; }
.photobox .ph svg { width: 30px; height: 30px; }

/* bottom bars in flows */
.cartbar { position: absolute; inset-inline: 0; bottom: 0; padding-block: 10px; background: var(--bg); border-top: 1px solid var(--line); }
.cartbar .in { display: flex; align-items: center; gap: 12px; }
.cartbar .sum { flex: 1; min-width: 0; }
.cartbar .sum b { font-family: var(--f-display); font-size: 18px; display: block; }

/* lines in cart */
.line { display: grid; grid-template-columns: auto 1fr auto; gap: 10px 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); align-items: center; }
.line:last-child { border-bottom: 0; }
.line .meta { min-width: 0; }
.line .meta b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.line .iconbtn { width: 40px; height: 40px; border-radius: 12px; }
.line .ctrl { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.step { display: inline-flex; align-items: center; border: 1px solid var(--line2); border-radius: 12px; overflow: hidden; background: var(--surface); }
.step button { width: 42px; height: 42px; border: 0; background: var(--surface2); display: grid; place-items: center; }
.step button svg { width: 18px; height: 18px; }
.rl .chip.all { padding: 4px 10px; min-height: 34px; font-size: 12px; flex: none; }
.step input { width: 64px; height: 42px; border: 0; text-align: center; background: transparent; font-weight: 700; font-size: 16px; }
.pr { display: flex; align-items: center; gap: 6px; }
.pr input { width: 92px; height: 42px; border: 1px solid var(--line2); border-radius: 12px; padding: 0 10px; background: var(--surface); text-align: end; font-weight: 600; }
.line .lt { margin-inline-start: auto; font-weight: 800; font-family: var(--f-display); }
.totals { display: flex; flex-direction: column; gap: 6px; }
.totals .r { display: flex; justify-content: space-between; gap: 12px; }
.totals .r.t { font-family: var(--f-display); font-weight: 800; font-size: 22px; padding-top: 8px; border-top: 1px dashed var(--line2); }

/* receipt */
.receipt { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; position: relative; }
.receipt .shop { text-align: center; display: flex; flex-direction: column; gap: 2px; }
.receipt .shop h2 { font-family: var(--f-display); font-size: 20px; font-weight: 800; }
.rl { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px dashed var(--line2); }
.rl .meta { flex: 1; min-width: 0; font-size: 14px; }
.rl .meta small { display: block; color: var(--ink2); font-size: 12px; }

/* ledger */
.led { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); width: 100%; border-inline: 0; border-top: 0; background: none; text-align: start; }
.led:last-child { border-bottom: 0; }
.led .a { font-weight: 700; text-align: end; }
.led .s { font-size: 12.5px; color: var(--ink2); }
.led .b { font-size: 12.5px; color: var(--ink2); text-align: end; }

/* bars in reports */
.hbar { height: 8px; border-radius: 99px; background: var(--surface2); overflow: hidden; margin-top: 6px; }
.hbar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.kv:last-child { border-bottom: 0; }
.kv span:first-child { color: var(--ink2); }
.kv b { font-weight: 700; text-align: end; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--ink2); font-size: 10px; font-family: var(--f-body); }

/* sheets */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 50; display: flex; align-items: flex-end; justify-content: center; animation: fade .18s ease-out; }
.sheet { width: min(100%, 560px); max-height: 92%; background: var(--bg); border-radius: 24px 24px 0 0; display: flex; flex-direction: column; animation: rise .22s ease-out; }
.sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line2); margin: 8px auto 0; flex: none; }
.sheet .sh { display: flex; align-items: center; gap: 10px; padding-top: 10px; padding-bottom: 6px; }
.sheet .sh h2 { flex: 1; font-family: var(--f-display); font-size: 19px; font-weight: 800; }
.sheet .sb { overflow-y: auto; padding-top: 8px; padding-bottom: 12px; display: flex; flex-direction: column; gap: 14px; }
.sheet .sf { padding-top: 10px; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: flex; gap: 10px; }
.sheet .sf > * { flex: 1; }
@keyframes rise { from { transform: translateY(40px); opacity: .6; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* toast */
#toast { position: fixed; inset-inline: 0; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 90; display: flex; justify-content: center; pointer-events: none; padding: 0 16px; }
.toast { background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-weight: 600; font-size: 14px; box-shadow: var(--shadow); max-width: 420px; animation: rise .2s ease-out; }
.toast.bad { background: var(--bad); color: #fff; }

/* lock */
.lock { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px 16px; max-width: 360px; margin: 0 auto; }
.lock h1 { font-family: var(--f-display); font-size: 24px; font-weight: 800; text-align: center; }
.pins { display: flex; gap: 14px; height: 18px; }
.pins i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line2); }
.pins i.f { background: var(--accent); border-color: var(--accent); }
.pins.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.pad3 { display: grid; grid-template-columns: repeat(3, 76px); gap: 14px; }
.pad3 button { width: 76px; height: 76px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-family: var(--f-display); font-size: 26px; font-weight: 700; display: grid; place-items: center; }
.pad3 button.x { border: 0; background: none; }
.pad3 button svg { width: 26px; height: 26px; }

[dir=rtl] * { letter-spacing: 0 !important; text-transform: none !important; }

/* ===== interactive charts, voucher, sale details ===== */
.chart .bg { cursor: pointer; } .chart .hit { fill: transparent; }
.chart.has-sel .bar { opacity: .25; } .chart .bar.sel, .chart.has-sel .bar.sel { opacity: 1; fill: var(--accent); }
.chart .bg:hover .bar { opacity: .8; }
.bpanel { background: var(--surface2); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.bpanel .bh { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.bpanel .bh b { font-size: 15px; } .bpanel .bt { font-weight: 800; font-size: 18px; }
.bpanel .stats { margin: 0; }
.chint { text-align: center; font-size: 12px; color: var(--ink2); margin: 2px 0 0; }
.vtag { display: inline-block; font-weight: 800; font-size: 11.5px; background: var(--accent-soft); color: var(--accent); padding: 1px 7px; border-radius: 7px; margin-inline-end: 4px; letter-spacing: .02em; }
.vtag.big { font-size: 16px; padding: 3px 11px; border-radius: 9px; }
.vhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sp .xl small { font-weight: 500; }
.sp .xt { border-top: 1px dashed var(--line); padding-top: 6px; margin-top: 2px; }
.vsearch { margin-bottom: 12px; }
.hero .retbox { flex: none; } .hero .retbox b { white-space: nowrap; }
#res:empty { display: none; }
.item.link { cursor: pointer; }

/* ===== online sync ===== */
.cpill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 12px; font-weight: 700; color: var(--ink2); min-height: 34px; flex: none; }
.cpill i { width: 8px; height: 8px; border-radius: 50%; background: var(--cash); }
.cpill.off i { background: var(--ink2); } .cpill.wait i, .cpill.sync i { background: var(--credit); } .cpill.bad i { background: var(--bad); }
.cpill.sync i { animation: cpulse 1s infinite; }
@keyframes cpulse { 50% { opacity: .25; } }
.lock.gate { justify-content: flex-start; overflow-y: auto; padding-top: 40px; padding-bottom: 40px; gap: 14px; }
.lock.gate .mark { width: 72px; height: 72px; border-radius: 18px; align-self: center; }
.lock.gate .btn.block, .lock.gate .field, .lock.gate .banner { width: 100%; box-sizing: border-box; }
.lock.gate .link { align-self: center; }

/* ===== Desktop layout (wide screens): sidebar navigation + roomy content ===== */

/* amount in words, lakh / crore style (e.g. 264310 -> Two Lakh Sixty Four Thousand Three Hundred Ten Only) */
const ONES = ['Zero', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
const TENS = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
function numWords(n) {
  n = Math.round(Math.abs(Number(n) || 0) * 100) / 100;
  let rs = Math.floor(n); const ps = Math.round((n - rs) * 100);
  const two = x => x < 20 ? ONES[x] : TENS[Math.floor(x / 10)] + (x % 10 ? ' ' + ONES[x % 10] : '');
  const three = x => x >= 100 ? ONES[Math.floor(x / 100)] + ' Hundred' + (x % 100 ? ' ' + two(x % 100) : '') : two(x);
  let w;
  if (rs === 0) w = 'Zero';
  else {
    const parts = [], cr = Math.floor(rs / 1e7); rs %= 1e7;
    const lk = Math.floor(rs / 1e5); rs %= 1e5;
    const th = Math.floor(rs / 1000); rs %= 1000;
    if (cr) parts.push(three(cr) + ' Crore');
    if (lk) parts.push(two(lk) + ' Lakh');
    if (th) parts.push(two(th) + ' Thousand');
    if (rs) parts.push(three(rs));
    w = parts.join(' ');
  }
  return w + (ps ? ' And ' + two(ps) + ' Paisa' : '') + ' Only';
}

function createEngine() {

  E.report = function (from, to) {
    const S = E.d.sales.filter(s => inRange(s.date, from, to));

    const P = E.d.payments.filter(p => inRange(p.date, from, to));
    const X = E.d.expenses.filter(x => inRange(x.date, from, to));

  if (b) return { ab: b[1], c: b[2] };

}

/* ---------- storage (IndexedDB) ---------- */
let idb = null, idbOK = false, warned = false;
function warnStorage() { if (!warned) { warned = true; toast(t('This browser is not saving your data. Use Backup often.'), true); } }
function openDB() {
  return new Promise(res => {
    try {
      const rq = indexedDB.open('threadshop', 2);
      rq.onupgradeneeded = () => { ['settings', '_sync'].concat(Core.STORES).forEach(s => { if (!rq.result.objectStoreNames.contains(s)) rq.result.createObjectStore(s, { keyPath: 'id' }); }); };
      rq.onsuccess = () => { idb = rq.result; idbOK = true; res(true); };
      rq.onerror = () => res(false); rq.onblocked = () => res(false);
    } catch (e) { res(false); }
  });
}
const idbAll = s => new Promise((res, rej) => { const rq = idb.transaction(s).objectStore(s).getAll(); rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); });
function idbWrite(ops) {
  if (!idbOK) return;
  try {
    const tx = idb.transaction(Array.from(new Set(ops.map(o => o.s))), 'readwrite');
    ops.forEach(o => { const st = tx.objectStore(o.s); if (o.put) st.put(o.put); else st.delete(o.del); });
    tx.onerror = tx.onabort = warnStorage;
  } catch (e) { warnStorage(); }
}
function idbReplaceAll() {
  if (!idbOK) return Promise.resolve(false);
  return new Promise(res => {
    try {
      const names = ['settings'].concat(Core.STORES), tx = idb.transaction(names, 'readwrite');
      names.forEach(n => tx.objectStore(n).clear());
      tx.objectStore('settings').put(E.d.settings);
      Core.STORES.forEach(s => E.d[s].forEach(o => tx.objectStore(s).put(o)));
      tx.oncomplete = () => res(true); tx.onerror = tx.onabort = () => { warnStorage(); res(false); };
    } catch (e) { warnStorage(); res(false); }
  });
}
E.onCommit = idbWrite;

      const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = rej; r.readAsDataURL(blob); });

  }

/* ---- PDF: one page holding the invoice image (no libraries) ---- */
async function pdfBlob(canvas, paper) {
  const jpg = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.92));
  const bytes = new Uint8Array(await jpg.arrayBuffer());
  const PW = paper === 'a5' ? 419.53 : 595.28, PH = paper === 'a5' ? 595.28 : 841.89, mg = 28;
  let iw = PW - 2 * mg, ih = iw * canvas.height / canvas.width;
  if (ih > PH - 2 * mg) { ih = PH - 2 * mg; iw = ih * canvas.width / canvas.height; }
  const x = (PW - iw) / 2, y = PH - mg - ih, enc = new TextEncoder(), parts = [], offs = []; let len = 0;
  const add = b => { if (typeof b === 'string') b = enc.encode(b); parts.push(b); len += b.length; };
  const obj = (n, body) => { offs[n] = len; add(n + ' 0 obj\n' + body + '\nendobj\n'); };
  add('%PDF-1.4\n');
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + PW.toFixed(2) + ' ' + PH.toFixed(2) + '] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
  offs[4] = len; add('4 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + canvas.width + ' /Height ' + canvas.height + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + bytes.length + ' >>\nstream\n'); add(bytes); add('\nendstream\nendobj\n');
  const cs = 'q ' + iw.toFixed(2) + ' 0 0 ' + ih.toFixed(2) + ' ' + x.toFixed(2) + ' ' + y.toFixed(2) + ' cm /Im0 Do Q';
  obj(5, '<< /Length ' + cs.length + ' >>\nstream\n' + cs + '\nendstream');
  const xr = len; let xs = 'xref\n0 6\n0000000000 65535 f \n';
  for (let i = 1; i <= 5; i++) xs += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
  add(xs + 'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n' + xr + '\n%%EOF');
  return new Blob(parts, { type: 'application/pdf' });
}

async function shareBlob(name, blob, title) {
  const mime = blob.type || 'application/octet-stream';
  if (window.AndroidBridge && AndroidBridge.shareFile) {
    try {
      const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = rej; r.readAsDataURL(blob); });
      if (AndroidBridge.shareFile(name, mime, b64, title, false)) return true;
    } catch (e) {}
  }
  try {
    const file = new File([blob], name, { type: mime });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title }); return true; }
  } catch (e) { if (e && e.name === 'AbortError') return true; }

  const last = new Map(); E.d.sales.forEach(x => { if (x.customerId && (last.get(x.customerId) || 0) < x.ts) last.set(x.customerId, x.ts); });
  const mode = V.custSort || 'owe';
  if (mode === 'last') list.sort((a, b) => ((last.get(b.id) || 0) - (last.get(a.id) || 0)) || a.name.localeCompare(b.name));

  else list.sort((a, b) => (cs.get(b.id).balance - cs.get(a.id).balance) || a.name.localeCompare(b.name));
  if (!list.length) return '<div class="list">' + (E.d.customers.length ? empty(t('Nothing matches your search')) : empty(t('No customers yet'), t('Add a customer to track what they owe you.'))) + '</div>';
  return '<div class="list">' + list.map(c => custRow(c, cs.get(c.id), true)).join('') + '</div>';

  const from = addDays(ymd(), -6), paid = new Set(); let got = 0;
  E.d.payments.filter(x => x.date >= from && x.customerId).forEach(x => { paid.add(x.customerId); got = r2(got + x.amount); });

}

  if (R.range === 'last') { const d = parseYmd(today); d.setDate(0); const e = ymd(d); return [e.slice(0, 8) + '01', e]; }

const compact = n => n >= 100000 ? Math.round(n / 1000) + 'k' : n >= 1000 ? (Math.round(n / 100) / 10) + 'k' : String(Math.round(n));

  days.forEach((d, i) => {
    const x = L + i * bw + gap / 2, w = Math.max(1, bw - gap); let base = 0;
    [['bc', d.cash], ['bo', d.online], ['bk', d.credit]].forEach(seg => { if (!seg[1]) return; const top = y(base + seg[1]), h = y(base) - top; g += '<rect class="' + seg[0] + '" x="' + x + '" y="' + top + '" width="' + w + '" height="' + h + '" rx="1.5"/>'; base += seg[1]; });
  });
  g += '<text x="' + L + '" y="' + (H - 6) + '">' + esc(dshort(days[0].date)) + '</text><text x="' + (W - R) + '" y="' + (H - 6) + '" text-anchor="end">' + esc(dshort(days[days.length - 1].date)) + '</text>';
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + t('Daily sales') + '">' + g + '</svg>';

      const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = rej; r.readAsDataURL(new Blob([text], { type: 'application/json' })); });

CH['noti-check'] = el => { const k = el.dataset.k; if (k === 'notif' && el.checked) NOTI.ask(); E.setSettings({ [k]: el.checked }); NOTI.pushNative(); render(); };
CH['noti-hour'] = el => { E.setSettings({ notifHour: Number(el.value) || 9 }); NOTI.pushNative(); };
A['noti-test'] = () => { NOTI.ask(); NOTI.fire(t('Test notification'), t('Notifications are working on this device.')); NOTI.sys(t('Test notification'), t('Notifications are working on this device.')); };
/* ---------- start-up ---------- */
(async function init() {
  const ok = await openDB();
  let data = null;
  if (ok) {
    try {
      const st = await idbAll('settings');
      if (st.length) { data = { settings: st[0] }; for (const s of Core.STORES) data[s] = await idbAll(s); }
    } catch (e) { data = null; }
  }
  if (data) E.load(data);
  else {
    E.load({}); E.setSettings({ createdAt: Date.now() });
    E.commit([{ s: 'users', put: { id: 'owner', name: 'Owner', role: 'owner', pin: '', createdAt: Date.now() } }]);
    E.seed();
  }
  if (!E.d.users.some(u => u.role === 'owner')) E.commit([{ s: 'users', put: { id: 'owner', name: 'Owner', role: 'owner', pin: '', createdAt: Date.now() } }]);
  applyPrefs();
  V.cur = E.d.users.find(u => u.role === 'owner');
  await Cloud.resume();
  if (Cloud.linked()) { V.cur = cloudUser(); Cloud.kick(800); }
  else if (Cloud.configured() && !cloudKV.getItem('ts_skip')) { V.gate = true; V.cl = { mode: 'signin' }; }
  if (hasPin()) V.locked = true;
  render();
  autoBio();
  if (!ok) toast(t('This browser is not saving your data. Use Backup often.'), true);
})();
</script>
